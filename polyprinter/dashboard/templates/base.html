<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyPrinter{% block title %}{% endblock %}</title>
<style>
  /* ── Design tokens ─────────────────────────────────────────────
     Light palette on :root, dark overrides under prefers-color-scheme.
     Values line up with the project's data-viz status/chart-chrome
     palette so charts and chrome read as one system. */
  :root {
    color-scheme: light dark;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f2f1ee;
    --surface-3: #e9e8e4;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.18);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-wash: rgba(42,120,214,0.10);
    --good: #0ca30c;
    --good-wash: rgba(12,163,12,0.12);
    --warning: #b9790a;
    --warning-wash: rgba(250,178,25,0.20);
    --serious: #c8552f;
    --serious-wash: rgba(236,131,90,0.16);
    --critical: #d03b3b;
    --critical-wash: rgba(208,59,59,0.12);
    --shadow-sm: 0 1px 2px rgba(11,11,11,0.05);
    --shadow-md: 0 2px 6px rgba(11,11,11,0.06), 0 8px 24px rgba(11,11,11,0.05);
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --radius-xs: 5px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --text-xs: 11.5px; --text-sm: 12.5px; --text-base: 13.5px; --text-md: 15px;
    --text-lg: 18px; --text-xl: 22px; --text-2xl: 28px; --text-hero: 34px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d0e;
      --surface: #16181b;
      --surface-2: #1c1f23;
      --surface-3: #24272c;
      --text: #f2f3f5;
      --text-2: #c3c2b7;
      --text-muted: #8b8e94;
      --border: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.16);
      --accent: #5b9bef;
      --accent-ink: #06131f;
      --accent-wash: rgba(91,155,239,0.14);
      --good: #34c759;
      --good-wash: rgba(52,199,89,0.14);
      --warning: #f0ad2e;
      --warning-wash: rgba(240,173,46,0.16);
      --serious: #ef9169;
      --serious-wash: rgba(239,145,105,0.14);
      --critical: #ef6a6a;
      --critical-wash: rgba(239,106,106,0.15);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.35), 0 12px 28px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    font-family: var(--font);
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-size: var(--text-base);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 650; letter-spacing: -0.01em; margin: 0 0 var(--sp-2); color: var(--text); }
  h1 { font-size: var(--text-2xl); }
  h2 { font-size: var(--text-lg); margin-top: var(--sp-6); }
  h3 { font-size: var(--text-md); }
  p { color: var(--text-2); margin: 0 0 var(--sp-3); max-width: 74ch; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--font-mono); font-size: 0.93em; }
  code {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: var(--radius-xs);
    color: var(--text-2);
  }

  /* ── Header / nav ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 var(--sp-5);
    display: flex;
    align-items: center;
    gap: var(--sp-5);
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: saturate(1.4) blur(6px);
  }
  header .brand {
    font-weight: 750;
    font-size: var(--text-md);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    white-space: nowrap;
  }
  header .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }
  .mode-badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.05em;
    background: var(--warning-wash);
    color: var(--warning);
    border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
    white-space: nowrap;
  }
  nav { display: flex; gap: var(--sp-1); flex-wrap: wrap; }
  nav a {
    color: var(--text-2);
    text-decoration: none;
    font-size: var(--text-sm);
    font-weight: 560;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    transition: background 0.12s ease, color 0.12s ease;
  }
  nav a:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }
  nav a.active { color: var(--accent-ink); background: var(--accent); }

  main { padding: var(--sp-6) var(--sp-5) var(--sp-7); max-width: 1180px; margin: 0 auto; }
  .page-lede { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }

  /* ── Cards / sections ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--sp-5);
  }
  .section-label {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0 0 var(--sp-3);
  }

  /* ── Stat tiles ── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--sp-4) var(--sp-5);
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    position: relative;
    overflow: hidden;
  }
  .stat-tile .label { color: var(--text-muted); font-size: var(--text-xs); font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-tile .value { font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
  .stat-tile .sub { font-size: var(--text-sm); color: var(--text-muted); }
  .stat-tile.accent-good::before, .stat-tile.accent-critical::before, .stat-tile.accent-warning::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .stat-tile.accent-good::before { background: var(--good); }
  .stat-tile.accent-critical::before { background: var(--critical); }
  .stat-tile.accent-warning::before { background: var(--warning); }

  /* ── Badges (status: never color alone — icon/glyph + label) ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: var(--text-xs);
    font-weight: 700;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    line-height: 1.6;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge .glyph { font-size: 0.9em; line-height: 1; }
  .badge-good { background: var(--good-wash); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
  .badge-critical { background: var(--critical-wash); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 30%, transparent); }
  .badge-warning { background: var(--warning-wash); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
  .badge-neutral { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
  .badge-accent { background: var(--accent-wash); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ── Tables ── */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
  /* border-collapse: separate (not collapse) is required here — a
     collapsed border shared between a sticky <th> and the first <tr>
     paints as part of whichever cell repaints last under `position:
     sticky`, which in practice made the sticky header visually cover
     the first data row. Each cell owns its own border under `separate`,
     so nothing is shared for the sticky repaint to fight over. */
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--text-base); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th {
    color: var(--text-muted);
    font-weight: 650;
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: sticky;
    top: 56px;
    z-index: 5;
    background: var(--surface-2);
    border-bottom: none;
    box-shadow: 0 1px 0 var(--border);
    user-select: none;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--text); }
  th.sortable .arrow { opacity: 0.35; margin-left: 3px; font-size: 0.85em; }
  th.sortable.sorted .arrow { opacity: 1; color: var(--accent); }
  .rank-cell { font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .rank-cell.top { color: var(--accent); }
  tr.rank-top1 td, tr.rank-top2 td, tr.rank-top3 td { background: var(--accent-wash); }

  /* ── Empty states ── */
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: var(--sp-7) var(--sp-5);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    background: var(--surface);
  }
  .empty-state .glyph { font-size: 28px; margin-bottom: var(--sp-2); opacity: 0.65; }
  .empty-state .headline { color: var(--text-2); font-weight: 650; font-size: var(--text-md); margin-bottom: 4px; }
  .empty-state p { max-width: 52ch; margin: 0 auto; color: var(--text-muted); font-size: var(--text-sm); }
  td.placeholder, .placeholder { color: var(--text-muted); font-style: italic; padding: var(--sp-6) 0; text-align: center; }

  /* ── Glossary hint ── */
  .hint {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--surface-3); color: var(--text-muted);
    font-size: 10px; font-weight: 700; margin-left: 4px;
    text-decoration: none; vertical-align: 1px;
    border: 1px solid var(--border);
  }
  .hint:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); text-decoration: none; }

  /* ── Glossary (Definitions page) ── */
  .glossary-card { padding: 0; overflow: hidden; }
  .term-item { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); scroll-margin-top: 72px; }
  .term-item:last-child { border-bottom: none; }
  .term-item:target { background: var(--accent-wash); }
  .term-name { font-weight: 650; font-size: var(--text-md); color: var(--text); margin-bottom: 4px; }
  .term-def { color: var(--text-2); max-width: 68ch; margin: 0; }
  .term-why {
    margin-top: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
    color: var(--text-2);
    font-size: var(--text-sm);
    max-width: 68ch;
  }

  /* ── Dossier (trader detail) ── */
  .dossier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-4); align-items: start; }
  .metric-row { padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); }
  .metric-row:last-child { border-bottom: none; padding-bottom: 0; }
  .metric-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
  .metric-label { color: var(--text-2); font-size: var(--text-sm); }
  .metric-value { font-weight: 650; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
  .metric-row-sub { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sparkline { width: 100%; height: 34px; display: block; margin-top: 4px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  .meter-line { display: flex; align-items: center; gap: var(--sp-2); margin-top: 6px; }
  .meter-tag { font-size: var(--text-xs); color: var(--text-muted); width: 42px; flex: none; }
  .meter { flex: 1; height: 7px; border-radius: 999px; background: var(--accent-wash); overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .meter-value { font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--text-2); width: 34px; text-align: right; flex: none; }

  .price-scale { margin-top: 6px; }
  .price-scale-track { position: relative; height: 6px; border-radius: 999px; background: var(--surface-3); }
  .price-scale-tick { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--text-muted); border-radius: 1px; transform: translateX(-1px); }
  .price-scale-tick.strong { background: var(--accent); width: 3px; height: 14px; top: -4px; }

  ::selection { background: var(--accent-wash); }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot"></span>PolyPrinter</span>
  <span class="mode-badge" title="Paper trading mode — no real capital is at risk. See Definitions.">PAPER</span>
  <nav>
    <a href="/" class="{{ 'active' if active_tab == 'now' }}">Now</a>
    <a href="/traders" class="{{ 'active' if active_tab == 'traders' }}">Traders</a>
    <a href="/decisions" class="{{ 'active' if active_tab == 'decisions' }}">Decisions</a>
    <a href="/calibration" class="{{ 'active' if active_tab == 'calibration' }}">Calibration</a>
    <a href="/us-vs-them" class="{{ 'active' if active_tab == 'us_vs_them' }}">Us vs Them</a>
    <a href="/definitions" class="{{ 'active' if active_tab == 'definitions' }}">Definitions</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
