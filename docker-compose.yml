services:
  scout:
    build: .
    command: ["python", "-m", "polyprinter.scout.run", "--loop"]
    volumes:
      - ./data:/app/data
    # Phase 3 (Mandates): only these two vars, not a blanket `env_file:
    # .env` — that root .env also holds Telegram/Phase-4/Phase-6 secrets
    # this container has no business seeing. Docker Compose auto-loads
    # .env from the compose file's own directory for ${...} substitution
    # here, no explicit env_file needed. Both intentionally unset if
    # .env doesn't define them — see mandate/issue.py, which treats a
    # missing key as "Mandates disabled," not a crash.
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    restart: unless-stopped

  mirror:
    build: .
    command: ["python", "-m", "polyprinter.mirror.run", "--loop"]
    volumes:
      - ./data:/app/data
    # Phase 4 (on-chain event detection): only this one var, same
    # least-privilege allowlist as scout's OPENROUTER_* block above —
    # this container has no business seeing Telegram/Phase-6 secrets
    # either. Missing/empty is intentional: mirror/run.py logs
    # "mirror.chain.disabled" and skips the chain watcher entirely,
    # doesn't crash — same pattern as mandate/issue.py.
    environment:
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
    restart: unless-stopped

  dashboard:
    build: .
    command: ["python", "-m", "polyprinter.dashboard.server"]
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8765:8765"
    # On-demand strategy narration (dashboard/server.py's /analyze route,
    # 2026-08-08): same least-privilege allowlist reasoning as scout's own
    # OPENROUTER_* block above — this was missed when that route was
    # added, which is why "Analyze strategy" stayed hidden/disabled even
    # with a real key in .env (server.py's strategy_configured check reads
    # os.environ, and this container was never given these two vars to
    # read). Dashboard still makes its own on-demand call here rather than
    # asking scout to do it — scout's LLM calls are for mandate issuance,
    # not narration, and the two shouldn't share a call site just because
    # they share a key.
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    restart: unless-stopped
